scheming_version: 2
dataset_type: dataset
about: A reimplementation of the default CKAN dataset schema
about_url: http://github.com/ckan/ckanext-scheming

dataset_fields:
  - start_form_page:
      title: Basic metadata
      description: Information about the dataset
    field_name: title
    label: Title
    preset: title
    required: true
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label: Description
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data
    required: true
    helper_text: e.g. provide a high-level overview of the dataset or project. You can include project aims, goals, methods, assays and outcomes. For examples visit the DSP User Guides for more information.

  - field_name: owner_org
    label: Organisation
    preset: dataset_organization
    helper_text: If you do not see the correct organisation reach out to DSPHelp@garvan.org.au

  - field_name: author
    label: Data Owner
    form_placeholder: Joe Bloggs
    display_property: dc:creator
    helper_text: Person responsible for final decisions about the dataset (e.g. PI, Faculty)

  - field_name: author_email
    label: Data Owner Email
    form_placeholder: joe@example.com
    display_property: dc:creator

  - field_name: maintainer
    label: Alternative Contact
    form_placeholder: Joe Bloggs
    display_property: dc:contributor
    helper_text: Data manager or best point of contact regarding maintenance and access to data. If multiple individuals, please add additional "Custom Field"

  - field_name: maintainer_email
    label: Alternative Contact Email
    form_placeholder: joe@garvan.org.au
    display_property: dc:contributor

  - field_name: ethics
    label: Garvan Ethics Reference
    form_placeholder: e.g. GRHP XXXX

  - field_name: hrec
    label: HREC Reference

  - field_name: nci
    label: NCI Project Code
    helper_text: If there are multiple NCI projects housing the data, please add additional "Custom Field"

  - field_name: publication_status
    label: Publication Status
    preset: select
    choices:
      - value: published
        label: Published
      - value: unpublished
        label: Unpublished
      - value: archived
        label: Archived
    helper_text: If published, attach a link to publication on next page.

  - start_form_page:
      title: Technical metadata
      description: Select all tags that apply to your dataset
    field_name: target
    label: Target
    preset: multiple_checkbox
    choices_helper: target
    validators: target ignore_missing
    output_validators: target_out

  - field_name: help_text_only
    help_text: "Help text example"

  - field_name: assay_type
    label: Sequencing Technology
    preset: multiple_checkbox
    choices_helper: assay_type
    validators: assay_type ignore_missing
    output_validators: assay_type_out

  - field_name: imaging
    label: Imaging Technology
    preset: multiple_checkbox
    choices_helper: imaging
    validators: imaging ignore_missing
    output_validators: imaging_out

  - field_name: molecules
    label: Molecule and Cell Technologies
    preset: multiple_checkbox
    choices_helper: molecules
    validators: molecules ignore_missing
    output_validators: molecules_out

  - field_name: source
    label: Organism
    preset: multiple_checkbox
    choices_helper: source
    validators: source ignore_missing
    output_validators: source_out

  - field_name: tissue
    label: Biological Sample Source
    preset: multiple_checkbox
    choices_helper: tissue
    validators: tissue ignore_missing
    output_validators: tissue_out

  - field_name: factor
    label: Experimental Characteristics
    preset: multiple_checkbox
    choices_helper: factor
    validators: factor ignore_missing
    output_validators: factor_out

  - field_name: tag_string
    label: Additional Tags
    preset: tag_string_autocomplete
    form_placeholder: eg. assays not listed above

  - field_name: disease
    label: Disease

resource_fields:
  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    required: true
    label: Name
    form_placeholder: eg. Google Drive Project Folder
    helper_text: De-identified, high-level patient information, NCI File Path, publications

  - field_name: description
    label: Description
    form_snippet: markdown.html
    form_placeholder: Very short description to help identify file, link or directory
